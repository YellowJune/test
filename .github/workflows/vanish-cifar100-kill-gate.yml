name: VANISH CIFAR-100 kill gate

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vanish-cifar100-kill-gate
    paths:
      - "vanish/experiments/cifar100_resnet_budget.py"
      - "vanish/src/vanish/**"
      - "vanish/.github/workflows/cifar100-kill-gate.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        buffer: [500, 2000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime
        run: python -m pip install --upgrade pip numpy scipy scikit-learn torch torchvision
      - name: Run budget-matched benchmark
        env:
          OPENBLAS_NUM_THREADS: "4"
          OMP_NUM_THREADS: "4"
        run: |
          cd vanish
          python experiments/cifar100_resnet_budget.py \
            --seeds 3 \
            --buffer-size "${{ matrix.buffer }}" \
            --tasks 10 \
            --train-per-class 100 \
            --width 512 \
            --ridge 0.001 \
            --gamma 2.0 \
            --overwrite \
            --output "results/raw/cifar100_resnet_buffer${{ matrix.buffer }}.jsonl"
      - name: Validate result count
        run: |
          test "$(wc -l < vanish/results/raw/cifar100_resnet_buffer${{ matrix.buffer }}.jsonl)" -eq 15
      - uses: actions/upload-artifact@v4
        with:
          name: cifar100-resnet-buffer${{ matrix.buffer }}
          path: vanish/results/raw/cifar100_resnet_buffer${{ matrix.buffer }}.jsonl
          if-no-files-found: error
          retention-days: 30
