name: Trainability Distillation Benchmark

on:
  push:
    paths:
      - 'trainability-real-llm/distillation_benchmark.py'
      - '.github/workflows/trainability-distillation-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HOME: ${{ github.workspace }}/.hf-cache
  TOKENIZERS_PARALLELISM: 'false'
  PYTHONUNBUFFERED: '1'

jobs:
  distill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU stack
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install 'transformers>=4.51,<5' 'huggingface_hub>=0.34' safetensors accelerate sentencepiece protobuf hf_xet
      - name: Run distillation benchmark
        run: |
          d='results/qwen-distill-seed${{ matrix.seed }}'
          mkdir -p "$d"
          python trainability-real-llm/distillation_benchmark.py --seed '${{ matrix.seed }}' --out "$d" 2>&1 | tee "$d/run.log"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tq-qwen-distill-seed${{ matrix.seed }}
          path: results/qwen-distill-seed${{ matrix.seed }}/
          if-no-files-found: warn
          retention-days: 30
