name: Trainability Qwen2.5 7B Long Continuation
on:
  push:
    paths:
      - 'trainability-real-llm/qwen7b_long_continuation.py'
      - '.github/workflows/trainability-qwen7b-long.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  HF_HOME: ${{ github.workspace }}/.hf-cache
  HF_HUB_DOWNLOAD_TIMEOUT: '180'
  HF_HUB_ETAG_TIMEOUT: '30'
  TOKENIZERS_PARALLELISM: 'false'
  PYTHONUNBUFFERED: '1'
jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h
      - name: Install CPU stack
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install 'transformers>=4.51,<5' 'huggingface_hub>=0.34' safetensors accelerate sentencepiece protobuf hf_xet 'datasets>=3,<5'
      - name: Run 7B 200-step full-LM continuation
        shell: bash
        run: |
          set -euo pipefail
          d='results/qwen7b-long-seed${{ matrix.seed }}'; mkdir -p "$d"
          python trainability-real-llm/qwen7b_long_continuation.py --seed '${{ matrix.seed }}' --steps 200 --out "$d" 2>&1 | tee "$d/run.log"
          test -n "$(find "$d" -name '*.json' -print -quit)"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tq-qwen7b-long-seed${{ matrix.seed }}
          path: results/qwen7b-long-seed${{ matrix.seed }}/
          if-no-files-found: error
          retention-days: 30
