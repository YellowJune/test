name: Trainability Real LLM Validation

on:
  push:
    paths:
      - 'trainability-real-llm/**'
      - '.github/workflows/trainability-real-llm.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HOME: ${{ github.workspace }}/.hf-cache
  TOKENIZERS_PARALLELISM: 'false'
  PYTHONUNBUFFERED: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: [qwen, llama, mistral]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU stack
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install 'transformers>=4.51,<5' 'huggingface_hub>=0.34' safetensors accelerate sentencepiece protobuf hf_xet
      - name: Environment
        run: |
          python - <<'PY'
          import os, platform, torch
          print(platform.platform())
          print('cpu_count', os.cpu_count())
          print('torch', torch.__version__)
          print('threads', torch.get_num_threads())
          PY
          df -h
          free -h
      - name: Run ${{ matrix.target }} real pretrained test
        run: |
          mkdir -p results/${{ matrix.target }}
          python trainability-real-llm/real_llm_test.py --target '${{ matrix.target }}' --out results/${{ matrix.target }} 2>&1 | tee results/${{ matrix.target }}/run.log
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainability-real-${{ matrix.target }}
          path: results/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 30
