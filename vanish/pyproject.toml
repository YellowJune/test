[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vanish-functional-annihilation"
version = "1.0.0"
description = "Exact finite-update preservation by function-space annihilation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "JunHyun Kim"}]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

